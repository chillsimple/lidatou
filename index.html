<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日午餐报餐统计</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --green: #2e9e5b;
    --green-dark: #23814a;
    --green-light: #e8f6ee;
    --gray: #9aa3ab;
    --gray-light: #f2f4f6;
    --red: #e25c5c;
    --orange: #f0a020;
    --text: #24292f;
    --card-bg: #ffffff;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #f5f7f6;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 16px; }

  .status-bar {
    background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
    color: #fff;
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
  }
  .status-bar .title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .status-bar .date { margin-top: 6px; font-size: 14px; opacity: .92; }
  .countdown {
    margin-top: 12px;
    background: rgba(255,255,255,.18);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .countdown strong { font-size: 18px; font-variant-numeric: tabular-nums; }
  .countdown.closed { background: rgba(0,0,0,.22); }

  .loading-tip {
    text-align: center;
    padding: 30px;
    color: var(--gray);
    font-size: 14px;
  }
  .loading-tip .spinner {
    display: inline-block;
    width: 30px;
    height: 30px;
    border: 3px solid var(--gray-light);
    border-top: 3px solid var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-status {
    font-size: 12px;
    color: rgba(255,255,255,.85);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
  }
  .sync-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .sync-status .dot.online { background: #7ddf9a; }
  .sync-status .dot.offline { background: #ff7a7a; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .tabs { display: flex; gap: 8px; margin-top: 14px; }
  .tab-btn {
    flex: 1;
    border: none;
    background: #fff;
    color: #5c6470;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 10px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all .15s;
  }
  .tab-btn.active { background: var(--green); color: #fff; }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-top: 14px;
  }
  .card h2 {
    font-size: 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card h2 .hint { font-size: 12px; color: var(--gray); font-weight: 400; }

  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-box { text-align: center; border-radius: 10px; padding: 12px 6px; }
  .stat-box .num { font-size: 28px; font-weight: 700; line-height: 1.2; }
  .stat-box .label { font-size: 12px; margin-top: 2px; color: #5c6470; }
  .stat-box.yes { background: var(--green-light); }
  .stat-box.yes .num { color: var(--green-dark); }
  .stat-box.no { background: #fdf0f0; }
  .stat-box.no .num { color: var(--red); }

  .name-list { margin-top: 12px; font-size: 13px; line-height: 1.8; }
  .name-list .row { display: flex; gap: 6px; align-items: flex-start; }
  .name-list .tag { flex-shrink: 0; font-weight: 600; }
  .name-list .tag.yes { color: var(--green-dark); }
  .name-list .tag.no { color: var(--red); }
  .empty-tip { color: var(--gray); font-size: 13px; }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--green); color: #fff; }
  .btn.plain { background: var(--gray-light); color: #444c56; }
  .btn.danger { background: #fdf0f0; color: var(--red); }
  .btn:hover { opacity: .88; }

  .staff-list { display: flex; flex-direction: column; gap: 10px; }
  .staff-item {
    padding: 10px 12px;
    border-radius: 10px;
    background: #fafbfa;
    border: 1px solid #eef1ee;
  }
  .staff-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .staff-item .name {
    flex: 0 1 auto;
    min-width: 64px;
    max-width: 220px;
    font-size: 15px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .staff-item .state-dot {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    flex-shrink: 0;
    background: var(--gray-light);
    color: #6b7280;
  }
  .staff-item.is-yes .state-dot { background: var(--green-light); color: var(--green-dark); }
  .staff-item.is-no .state-dot { background: #fdf0f0; color: var(--red); }
  .choice-group { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; max-width: 100%; align-items: center; flex-wrap: wrap; }
  .choice-btn {
    border: 1px solid #d8ded8;
    background: #fff;
    color: #444c56;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .choice-btn:disabled { cursor: not-allowed; opacity: .55; }
  .choice-btn.yes.active { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  .choice-btn.no.active { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  .choice-btn.rest.active { background: #f0a020; border-color: #f0a020; color: #fff; font-weight: 600; }
  .choice-btn.away.active { background: #6b7280; border-color: #6b7280; color: #fff; font-weight: 600; }

  .skip-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    background: #fff7e8;
    color: #9a6b00;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    flex-wrap: wrap;
  }
  .note-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    margin-left: 6px;
    background: #f0f7ff;
    color: #2d5f80;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    flex-wrap: wrap;
  }
  .skip-badge button {
    border: none; background: none; cursor: pointer;
    color: #9a6b00; font-size: 12px; text-decoration: underline; padding: 0;
  }
  .editor {
    margin-top: 8px;
    background: #fff;
    border: 1px dashed #e3e0d8;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    font-size: 13px;
  }
  .editor .full { width: 100%; font-weight: 600; }
  .editor .tip { width: 100%; color: #9a6b00; font-size: 12px; }
  .editor input[type="text"] {
    flex: 1; min-width: 180px;
    border: 1px solid #d8ded8; border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none;
  }
  .editor input[type="date"] {
    border: 1px solid #d8ded8; border-radius: 8px; padding: 6px 8px; font-size: 13px; outline: none;
  }
  .editor label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .mini { border: none; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .mini.ok { background: var(--green); color: #fff; }
  .mini.cancel { background: var(--gray-light); color: #444c56; }

  .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .add-row input {
    flex: 1;
    border: 1px solid #d8ded8;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    min-width: 0;
  }
  .add-row input:focus { border-color: var(--green); }
  .mgr-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
  }
  .mgr-item:nth-child(even) { background: #fafbfa; }
  .mgr-item .del {
    border: none;
    background: none;
    color: var(--red);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
  }

  details { margin-top: 14px; }
  details summary {
    cursor: pointer;
    font-size: 14px;
    color: var(--green-dark);
    font-weight: 600;
    user-select: none;
  }

  .month-nav {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
  }
  .month-nav .m-title { font-size: 17px; font-weight: 700; }
  .month-nav button {
    border: none; background: var(--gray-light); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 14px;
  }
  .month-summary {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px;
  }
  .day-block { border: 1px solid #eef1ee; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .day-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: #fafbfa; cursor: pointer; font-size: 14px;
  }
  .day-head .d-date { font-weight: 600; }
  .day-head .d-total { color: var(--green-dark); font-weight: 600; }
  .day-detail { padding: 4px 12px 10px; font-size: 13px; display: none; }
  .day-block.open .day-detail { display: block; }
  .day-detail .p-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed #f0f2f0; }
  .day-detail .p-row:last-child { border-bottom: none; }
  .p-note { color: var(--gray); font-size: 12px; }
  .st-yes { color: var(--green-dark); font-weight: 600; flex-shrink: 0; }
  .st-no { color: var(--red); flex-shrink: 0; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 48px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(36,41,47,.92);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s;
    z-index: 99;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .closed-mask-tip {
    background: #fff7e8;
    color: #9a6b00;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }
  body.closed .closed-mask-tip { display: block; }
  body.closed .choice-btn:not(.active) { opacity: .55; }
  body.closed .choice-btn.yes, body.closed .choice-btn.no { opacity: .55; }

  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .stat-box .num { font-size: 24px; }
    .month-summary { grid-template-columns: repeat(3,1fr); gap: 6px; }
    .choice-btn { font-size: 12px; padding: 6px 10px; }
    .staff-item .name { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="status-bar">
    <div class="title">🍚 每日午餐报餐统计 <span style="font-size:12px;opacity:.7;font-weight:400;">云端共享</span></div>
    <div class="date" id="dateLine">加载中…</div>
    <div class="countdown" id="countdownBox">
      <span>⏰ 距 10:00 截止还有</span>
      <strong id="countdown">--:--:--</strong>
    </div>
    <div class="sync-status" id="syncStatus">
      <span class="dot online" id="syncDot"></span>
      <span id="syncText">连接中...</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabToday" data-primary-action>今日报餐</button>
    <button class="tab-btn" id="tabLedger">月度台账</button>
  </div>

  <div id="paneToday">
    <div class="card">
      <h2>今日统计 <span class="hint" id="statHint"></span></h2>
      <div class="stats-grid">
        <div class="stat-box yes"><div class="num" id="numYes">0</div><div class="label">报餐人数</div></div>
        <div class="stat-box no"><div class="num" id="numNo">0</div><div class="label">不报人数（含未确认）</div></div>
      </div>
      <div class="name-list">
        <div class="row"><span class="tag yes">报餐：</span><span id="listYes" class="empty-tip">暂无</span></div>
        <div class="row"><span class="tag no">不报：</span><span id="listNo" class="empty-tip">暂无</span></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="copyBtn" data-primary-action>📋 复制统计结果（发群里）</button>
        <button class="btn plain" id="copyRemindBtn">📣 复制催报提醒</button>
      </div>
    </div>

    <div class="card">
      <h2>员工报餐 <span class="hint">10:00 后锁定，未确认按不报统计</span></h2>
      <div class="closed-mask-tip">🔒 今日报餐已截止（10:00），报餐与今天不报已锁定；"一段时间不报"和"请假/出差"仍可设置（从明天起生效）。</div>
      <div id="loadingIndicator" class="loading-tip">
        <div class="spinner"></div>
        <div>正在同步云端数据...</div>
      </div>
      <div class="staff-list" id="staffList" style="display:none;"></div>
    </div>

    <div class="card">
      <details>
        <summary>⚙️ 管理员：名单维护与重置</summary>
        <div style="margin-top:14px;">
          <div class="add-row">
            <input type="text" id="newName" placeholder="输入员工姓名" maxlength="12">
            <button class="btn primary" id="addBtn" data-primary-action>添加员工</button>
          </div>
          <div id="mgrList"></div>
          <div class="btn-row">
            <button class="btn danger" id="resetBtn">🔄 重置今日报餐记录</button>
          </div>
          <p style="font-size:12px;color:var(--gray);margin-top:10px;">
            说明：添加/删除员工会同步到云端，所有人可见；重置只清空今日选择与备注，不删除名单。
          </p>
        </div>
      </details>
    </div>
  </div>

  <div id="paneLedger" class="hidden">
    <div class="card">
      <div class="month-nav">
        <button id="prevMonth">◀ 上月</button>
        <div class="m-title" id="monthTitle">—</div>
        <button id="nextMonth">下月 ▶</button>
      </div>
      <div class="month-summary">
        <div class="stat-box yes"><div class="num" id="mDays">0</div><div class="label">统计天数</div></div>
        <div class="stat-box yes"><div class="num" id="mTotal">0</div><div class="label">月累计报餐人次</div></div>
        <div class="stat-box no"><div class="num" id="mAvg">0</div><div class="label">日均报餐人数</div></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="downloadCsvBtn" data-primary-action>📄 下载本月台账 CSV</button>
        <button class="btn plain" id="copyMonthBtn">📋 复制本月汇总文字</button>
      </div>
      <div id="dayList" style="margin-top:16px;"></div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ============================================================
// 🔧 Supabase 配置 —— 已替换为你的
// ============================================================
var SUPABASE_URL = 'https://ghiwjnmlknualcalwklt.supabase.co';
var SUPABASE_KEY = 'sb_publishable_4I5CULurmyMfKywdBDeSzQ_jArdiRrk';
// ============================================================

(function () {
  'use strict';

  var DEADLINE_HOUR = 10;
  var TABLE_NAME = 'meal_reports';

  // ---------- 工具函数 ----------
  function pad2(n) { return String(n).padStart(2, '0'); }
  function toKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayStr() { return toKey(new Date()); }
  function monthKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
  function addDays(dateStr, n) {
    var p = dateStr.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + n);
    return toKey(d);
  }
  function monthEnd(dateStr) {
    var p = dateStr.split('-');
    var last = new Date(+p[0], +p[1], 0);
    return toKey(last);
  }
  function shiftMonth(mKey, delta) {
    var p = mKey.split('-');
    var d = new Date(+p[0], +p[1] - 1 + delta, 1);
    return monthKey(d);
  }
  function weekText(d) { return ['日', '一', '二', '三', '四', '五', '六'][d.getDay()]; }
  function weekTextOf(dateStr) {
    var p = dateStr.split('-');
    return weekText(new Date(+p[0], +p[1] - 1, +p[2]));
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] || c;
  }); }

  // ---------- 状态 ----------
  var state = {
    date: todayStr(),
    staff: [],
    records: {},
    notes: {},
    skips: {},
    ledger: {}
  };
  var viewMonth = monthKey(new Date());
  var editing = null;
  var recordId = null;
  var isLoading = true;

  // ---------- DOM ----------
  var el = {
    dateLine: document.getElementById('dateLine'),
    numYes: document.getElementById('numYes'),
    numNo: document.getElementById('numNo'),
    listYes: document.getElementById('listYes'),
    listNo: document.getElementById('listNo'),
    staffList: document.getElementById('staffList'),
    mgrList: document.getElementById('mgrList'),
    newName: document.getElementById('newName'),
    toast: document.getElementById('toast'),
    paneToday: document.getElementById('paneToday'),
    paneLedger: document.getElementById('paneLedger'),
    loadingIndicator: document.getElementById('loadingIndicator'),
    syncStatus: document.getElementById('syncStatus'),
    syncDot: document.getElementById('syncDot'),
    syncText: document.getElementById('syncText')
  };

  // ---------- Toast ----------
  var toastTimer = null;
  function showToast(msg, duration) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, duration || 2200);
  }

  // ---------- Supabase API 封装 ----------
  function setSyncStatus(online, msg) {
    el.syncDot.className = 'dot ' + (online ? 'online' : 'offline');
    el.syncText.textContent = msg || (online ? '已连接云端' : '离线模式');
  }

  async function supabaseRequest(method, path, body) {
    var url = SUPABASE_URL + '/rest/v1/' + path;
    var headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    };
    var options = { method: method, headers: headers };
    if (body) options.body = JSON.stringify(body);
    var resp = await fetch(url, options);
    if (!resp.ok) {
      var errText = await resp.text();
      throw new Error('Supabase API error: ' + resp.status + ' ' + errText);
    }
    return resp;
  }

  async function loadFromCloud() {
    try {
      setSyncStatus(true, '正在加载...');
      isLoading = true;
      el.loadingIndicator.style.display = 'block';
      el.staffList.style.display = 'none';

      var resp = await supabaseRequest('GET', TABLE_NAME + '?order=created_at.desc&limit=1');
      var data = await resp.json();

      if (!data || data.length === 0) {
        await createDefaultData();
        return await loadFromCloud();
      }

      var row = data[0];
      recordId = row.id;
      state.date = row.date || todayStr();
      state.staff = row.staff || [];
      state.records = row.records || {};
      state.notes = row.notes || {};
      state.skips = row.skips || {};
      state.ledger = row.ledger || {};

      if (state.date !== todayStr()) {
        var oldMonth = monthKey(new Date(state.date + 'T00:00:00'));
        if (!state.ledger[oldMonth]) state.ledger[oldMonth] = {};
        var yesCount = 0;
        state.staff.forEach(function(n) { if (state.records[n] === 'yes') yesCount++; });
        state.ledger[oldMonth][state.date] = {
          date: state.date,
          staff: state.staff.slice(),
          records: Object.assign({}, state.records),
          notes: Object.assign({}, state.notes),
          total: yesCount
        };
        state.date = todayStr();
        state.records = {};
        state.notes = {};
        var today = todayStr();
        Object.keys(state.skips).forEach(function(name) {
          var sk = state.skips[name];
          if (sk.end && sk.end < today) {
            delete state.skips[name];
          }
        });
        await saveToCloud();
      }

      applySkipsToday();

      isLoading = false;
      el.loadingIndicator.style.display = 'none';
      el.staffList.style.display = 'block';
      setSyncStatus(true, '已同步云端');
      renderAll();
      return true;
    } catch (e) {
      console.error('加载云端数据失败:', e);
      setSyncStatus(false, '连接失败，使用本地缓存');
      try {
        var cached = localStorage.getItem('meal_report_cache');
        if (cached) {
          var parsed = JSON.parse(cached);
          state.date = parsed.date || todayStr();
          state.staff = parsed.staff || [];
          state.records = parsed.records || {};
          state.notes = parsed.notes || {};
          state.skips = parsed.skips || {};
          state.ledger = parsed.ledger || {};
          applySkipsToday();
          isLoading = false;
          el.loadingIndicator.style.display = 'none';
          el.staffList.style.display = 'block';
          renderAll();
          showToast('使用本地缓存数据，请检查网络', 3000);
        }
      } catch (e2) { /* ignore */ }
      return false;
    }
  }

  async function createDefaultData() {
    var defaultStaff = ['张三', '李四', '王五', '赵六', '孙七'];
    var body = {
      date: todayStr(),
      staff: defaultStaff,
      records: {},
      notes: {},
      skips: {},
      ledger: {}
    };
    await supabaseRequest('POST', TABLE_NAME, body);
    showToast('已创建默认数据');
  }

  async function saveToCloud() {
    if (!recordId) {
      var body = {
        date: state.date,
        staff: state.staff,
        records: state.records,
        notes: state.notes,
        skips: state.skips,
        ledger: state.ledger
      };
      var resp = await supabaseRequest('POST', TABLE_NAME, body);
      var data = await resp.json();
      recordId = data[0] ? data[0].id : null;
      cacheLocally();
      return;
    }

    try {
      var body = {
        date: state.date,
        staff: state.staff,
        records: state.records,
        notes: state.notes,
        skips: state.skips,
        ledger: state.ledger
      };
      await supabaseRequest('PATCH', TABLE_NAME + '?id=eq.' + recordId, body);
      cacheLocally();
      setSyncStatus(true, '已保存云端');
    } catch (e) {
      console.error('保存到云端失败:', e);
      setSyncStatus(false, '保存失败');
      cacheLocally();
      showToast('保存失败，已缓存到本地', 3000);
    }
  }

  function cacheLocally() {
    try {
      localStorage.setItem('meal_report_cache', JSON.stringify(state));
    } catch (e) { /* ignore */ }
  }

  function applySkipsToday() {
    var today = state.date;
    state.staff.forEach(function(name) {
      var sk = state.skips[name];
      if (sk && sk.start && today >= sk.start) {
        if (sk.end == null || today <= sk.end) {
          if (state.records[name] !== 'yes') {
            state.records[name] = 'no';
          }
        }
      }
    });
  }

  function isClosed() { return new Date().getHours() >= DEADLINE_HOUR; }

  // ---------- 渲染 ----------
  function renderDate() {
    var d = new Date();
    el.dateLine.textContent = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' +
      d.getDate() + ' 日 · 星期' + weekText(d) + ' · 午餐统计';
  }

  function renderCountdown() {
    var box = document.getElementById('countdownBox');
    if (isClosed()) {
      document.body.classList.add('closed');
      box.classList.add('closed');
      box.innerHTML = '<span>🔒 今日报餐已截止，统计结果已固定</span>';
      return;
    }
    document.body.classList.remove('closed');
    box.classList.remove('closed');
    var now = new Date();
    var deadline = new Date();
    deadline.setHours(DEADLINE_HOUR, 0, 0, 0);
    var diff = deadline - now;
    var h = Math.floor(diff / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    box.innerHTML = '<span>⏰ 距 10:00 截止还有</span><strong>' +
      pad2(h) + ':' + pad2(m) + ':' + pad2(s) + '</strong>';
  }

  function splitYesNo() {
    var yes = [], no = [];
    state.staff.forEach(function(name) {
      if (state.records[name] === 'yes') yes.push(name);
      else no.push(name);
    });
    return { yes: yes, no: no };
  }

  function displayName(name) {
    var note = state.notes[name];
    return note ? name + '（' + note + '）' : name;
  }

  function renderStats() {
    var r = splitYesNo();
    el.numYes.textContent = r.yes.length;
    el.numNo.textContent = r.no.length;
    el.listYes.textContent = r.yes.join('、') || '暂无';
    el.listNo.textContent = r.no.length ? r.no.map(function(n) { return displayName(n); }).join('、') : '暂无';
    el.listYes.className = r.yes.length ? '' : 'empty-tip';
    el.listNo.className = r.no.length ? '' : 'empty-tip';
    document.getElementById('statHint').textContent = '共 ' + state.staff.length + ' 人';
  }

  function rangeText(sk) {
    if (sk.end == null) return esc(sk.start) + ' 起 · 长期（直到销假）';
    return esc(sk.start) + ' 至 ' + esc(sk.end);
  }
